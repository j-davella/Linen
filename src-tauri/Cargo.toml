[package]
name = "linen"
version = "0.2.0"
edition = "2021"
description = "Co-work shell: Claude Code + a shared terminal, with an approval gate"

[lib]
name = "linen_lib"
# rlib only: the cdylib/staticlib kinds are for mobile targets, and on
# windows-gnu the cdylib hits ld's 65k export-ordinal limit.
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri       = { version = "2", features = [] }
serde       = { version = "1", features = ["derive"] }
serde_json  = "1"
tokio       = { version = "1", features = ["full"] }
axum        = "0.8"
rusqlite    = { version = "0.32", features = ["bundled"] }
chrono      = "0.4"
uuid        = { version = "1", features = ["v4"] }
anyhow      = "1"
regex       = "1"
dirs        = "5"
which       = "7"
toml        = "0.8"
portable-pty = "0.9"
vt100       = "0.15"
tracing     = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
tauri-plugin-single-instance = "2"

[profile.release]
strip = true
lto = "thin"
